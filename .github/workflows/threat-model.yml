name: Threat Model

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - '**.yaml'
      - '**.yml'
      - '**.json'
      - '**.py'
  pull_request:
    paths:
      - 'examples/**'
      - '**.yaml'
      - '**.yml'
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Input file to model (relative path)'
        required: false
        default: 'examples/webapp.yaml'

jobs:
  threat-model:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run threat model on sample app
        run: |
          python p2_threat_model.py \
            --input ${{ github.event.inputs.input_file || 'examples/webapp.yaml' }} \
            --no-llm \
            --output output/

      - name: Run threat model on K8s example
        run: |
          python p2_threat_model.py \
            --input examples/k8s-webapp.yaml \
            --no-llm \
            --output output/

      - name: Upload HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: threat-model-reports
          path: output/*.html
          retention-days: 30

      - name: Upload JSON exports
        uses: actions/upload-artifact@v4
        with:
          name: threat-model-json
          path: output/*.json
          retention-days: 30

      - name: Comment PR with threat summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readdirSync('output').filter(f => f.endsWith('.json'));
            let body = '## Threat Model Results\n\n';

            for (const file of files) {
              const data = JSON.parse(fs.readFileSync(`output/${file}`, 'utf8'));
              const name = data.application?.name || file;
              const score = data.overall_risk_score?.toFixed(0) || 'N/A';
              const critical = data.summary?.critical || 0;
              const high = data.summary?.high || 0;
              const medium = data.summary?.medium || 0;
              const low = data.summary?.low || 0;

              const badge = score >= 70 ? '🔴' : score >= 40 ? '🟠' : '🟢';
              body += `### ${badge} ${name}\n`;
              body += `**Risk Score:** ${score}/100\n\n`;
              body += `| Critical | High | Medium | Low |\n`;
              body += `|----------|------|--------|-----|\n`;
              body += `| ${critical} | ${high} | ${medium} | ${low} |\n\n`;

              if (data.compliance_flags?.length > 0) {
                const frameworks = [...new Set(data.compliance_flags.map(f => f.framework))];
                body += `**Compliance flags:** ${frameworks.join(', ')}\n\n`;
              }
            }

            body += '_Generated by P2 Threat Model Generator — no data left the runner_';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
